{% extends "base.html" %}
{% block title %}404 Not Found — FloodWatch Community{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <span class="auth-icon">🔍</span>
            <h1 class="auth-title">404 — Page Not Found</h1>
            <p class="auth-subtitle">The page you're looking for doesn't exist or has been moved.</p>
        </div>
        <div class="auth-footer">
            <a href="{{ url_for('home') }}" class="btn btn-primary">← Back to Dashboard</a>
            <a href="{{ url_for('report_page') }}" class="btn btn-outline" style="margin-top:0.5rem">Report a Flood</a>
        </div>
    </div>
</div>
{% endblock %}
